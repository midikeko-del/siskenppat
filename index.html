<style>
  :root{
    --ink:#0f172a; --ink2:#1e293b; --slate:#64748b; --slate-l:#94a3b8;
    --line:#e2e8f0; --bg:#f1f5f9; --card:#ffffff;
    --amber:#fbbf24; --amber-d:#d97706; --amber-bg:#fffbeb;
    --green:#059669; --green-bg:#ecfdf5; --green-line:#a7f3d0;
    --red:#e11d48; --red-bg:#fff1f2; --red-line:#fecdd3;
    --sky:#0284c7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select{font-family:inherit;font-size:14px;width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px 12px;background:#fff}
  input:focus,select:focus{outline:2px solid var(--amber);border-color:var(--amber)}

  /* ===== Pengepala ===== */
  header{background:var(--ink);color:#fff}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .head-top{display:flex;align-items:center;justify-content:space-between;padding:16px 0;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:42px;height:42px;border-radius:10px;background:var(--amber);display:flex;align-items:center;justify-content:center;font-size:22px}
  .brand h1{font-size:17px;font-weight:700;line-height:1.2}
  .brand p{font-size:12px;color:var(--slate-l)}
  .admin{display:flex;align-items:center;gap:10px;text-align:right}
  .admin .nm{font-size:13px;font-weight:600}

  .sync{font-size:11px;font-weight:600;padding:4px 11px;border-radius:99px;border:1px solid #334155;white-space:nowrap}
  .sync.local{color:#94a3b8}
  .sync.ok{color:#34d399;border-color:#065f46}
  .sync.saving{color:#fbbf24;border-color:#92400e}
  .sync.err{color:#fb7185;border-color:#9f1239}

  .logout:hover{background:#334155;color:#fff}

  .login-logo{width:58px;height:58px;border-radius:14px;background:var(--amber);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto}
  .login-card h2{text-align:center;font-size:22px}
  .login-sub{text-align:center;font-size:13px;color:var(--slate);margin-top:-8px}
  .login-note{font-size:13px;color:var(--slate);background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.6}
  nav{display:flex;gap:4px;overflow-x:auto}
  nav button{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:14px;font-weight:500;color:#cbd5e1;border-radius:10px 10px 0 0;white-space:nowrap}
  nav button:hover{background:var(--ink2);color:#fff}
  nav button.active{background:var(--bg);color:var(--ink)}
  .badge{background:var(--amber);color:var(--ink);font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px}

  main{max-width:1180px;margin:0 auto;padding:24px 20px;display:grid;gap:22px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px}

  .stat .v{font-size:26px;font-weight:800;line-height:1}
  .stat .l{font-size:12px;color:var(--slate);margin-top:4px}
  .c-green{color:var(--green)} .c-amber{color:var(--amber-d)} .c-red{color:var(--red)} .c-sky{color:var(--sky)}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate-l);padding:10px 16px;border-bottom:1px solid var(--line);font-weight:600}

  .chip.green{background:var(--green-bg);color:var(--green);border-color:var(--green-line)} .chip.green .dot{background:var(--green)}
  .chip.amber{background:var(--amber-bg);color:var(--amber-d);border-color:#fde68a} .chip.amber .dot{background:var(--amber-d)}
  .chip.red{background:var(--red-bg);color:var(--red);border-color:var(--red-line)} .chip.red .dot{background:var(--red)}
  .chip.gray{background:#f1f5f9;color:var(--slate);border-color:var(--line)} .chip.gray .dot{background:var(--slate)}

  .btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:9px 16px;border-radius:10px;transition:.15s}

  .btn-green{background:var(--green);color:#fff;justify-content:center;flex:1} .btn-green:hover{background:#047857}
  .btn-red{background:#fff;border:1px solid var(--red-line);color:var(--red);justify-content:center;flex:1} .btn-red:hover{background:var(--red-bg)}

  /* ===== Modal & toast ===== */

  .modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;border-radius:18px 18px 0 0}
  .modal-h h3{font-size:16px;font-weight:700}
  .modal-x{font-size:20px;color:var(--slate-l);line-height:1;padding:4px 8px}

  .modal-b{padding:20px;display:grid;gap:14px}
  .summary{background:#f8fafc;border-radius:10px;padding:13px 15px;font-size:13px;color:var(--slate)}
  .summary b{color:var(--ink);font-size:14px}
  .clash{background:var(--red-bg);border:1px solid var(--red-line);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--red)}
  .clash p{font-size:12px;margin-top:4px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row4{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
  .err{font-size:12px;color:var(--red)}
  .btn-row{display:flex;gap:10px}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;padding:13px 22px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:50;display:none;align-items:center;gap:9px}
  #toast.show{display:flex}

  @media(max-width:640px){
    .wrap{padding:0 12px}
    main{padding:16px 12px;gap:16px}
    .head-top{padding:10px 0;gap:8px}

    .brand h1{font-size:13.5px}
    .brand p{font-size:9.5px;letter-spacing:.01em}

    .stats{grid-template-columns:1fr 1fr;gap:10px}

    .card-h{padding:12px 14px}
    th,td{padding:9px 10px}
    .bk{flex-direction:column;padding:14px 16px}
    .bk .btn{width:100%;justify-content:center}
    .fleet{grid-template-columns:1fr}
    .btn{font-size:13px;padding:9px 14px}
    .modal{border-radius:14px;max-height:94vh}
    .modal-b{padding:16px;gap:12px}

    .rpt-stat{padding:12px 13px}
    .rpt-stat .v{font-size:18px}
    .act-row{flex-wrap:wrap}
    .login-card{padding:26px 22px;border-radius:16px}
    input,select{font-size:16px} /* elak auto-zoom iOS semasa taip */
  }
</style>

const API_URL = "https://script.google.com/macros/s/AKfycbzIv8zPV-KGmKJCTc345abS62abIGstMgYcDhvOVvvc6k03h3165g0GZzITa5iA0sHaeg/exec";

/* ================= DATA ================= */
/* ===== Tarikh & masa sebenar — zon Asia/Kuala_Lumpur (GMT+8) ===== */
const pad2 = n => String(n).padStart(2, "0");
function klNow(){
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Kuala_Lumpur",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23",
  }).formatToParts(new Date());
  const g = (t) => parts.find(x => x.type === t).value;
  return { tarikh: `${g("year")}-${g("month")}-${g("day")}`, masa: `${g("hour")}:${g("minute")}` };
}
/* Tambah n hari kepada tarikh ISO (yyyy-mm-dd) */
function tambahHari(iso, n){
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + n);
  return dt.toISOString().slice(0, 10);
}
/* HARI_INI & MINGGU dikira SEMULA setiap render (lihat render()) supaya tetap
   betul walaupun app dibuka melepasi tengah malam tanpa reload. */
let HARI_INI, MINGGU;
function segarTarikh(){
  HARI_INI = klNow().tarikh; // tarikh hari ini di Malaysia
  // Minggu PENUH semasa (Ahad–Sabtu) — minggu Terengganu bermula Ahad
  const hari = new Date(HARI_INI + "T00:00:00Z").getUTCDay(); // 0 = Ahad
  const ahad = tambahHari(HARI_INI, -hari);
  MINGGU = Array.from({ length: 7 }, (_, i) => tambahHari(ahad, i));
}

/* ================= UTILITI ================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const overlap = (a1,a2,b1,b2) => a1 < b2 && b1 < a2;
/* Jika masa tamat kosong, tempahan dianggap berjalan sehingga pemandu tekan Selesai
   (untuk semakan konflik, ia menghalang sehingga 23:59 atau sehingga ditanda selesai) */
const tamatEf = (b) => b.masaTamat || "23:59";
const paparMasa = (b) => b.masaTamat ? `${b.masaMula}–${b.masaTamat}` : `${b.masaMula} → <i style="font-weight:400">(belum tamat)</i>`;
/* Sokongan tempahan berbilang hari */
const tarikhTamatEf = (b) => b.tarikhTamat || b.tarikh;                       // tarikh hujung efektif
const mulaDT  = (b) => `${b.tarikh} ${b.masaMula}`;                           // titik mula (tarikh+masa)
const tamatDT = (b) => `${tarikhTamatEf(b)} ${tamatEf(b)}`;                   // titik tamat (tarikh+masa)
const dudukiHari = (b, hari) => b.tarikh <= hari && hari <= tarikhTamatEf(b); // adakah tempahan meliputi hari ini?
const paparTarikh = (b) => (b.tarikhTamat && b.tarikhTamat !== b.tarikh)
  ? `${fmtTarikh(b.tarikh)} – ${fmtTarikh(b.tarikhTamat)}`
  : fmtTarikh(b.tarikh);
const veh = (id) => vehicles.find(v => v.id === id);
const drv = (id) => drivers.find(d => d.id === id);

function fmtTarikh(iso){
  const bln = ["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogo","Sep","Okt","Nov","Dis"];
  const [y,m,d] = iso.split("-");
  return `${parseInt(d)} ${bln[parseInt(m)-1]} ${y}`;
}

const chip = (cfg) => `<span class="chip ${cfg.cls}"><span class="dot"></span>${cfg.label}</span>`;
const rm = (n) => "RM " + n.toLocaleString("ms-MY", {minimumFractionDigits:2});
/* Jumlah jam sebenar tempahan, termasuk yang merentas hari */
const jamTempahan = (b) => {
  if(!b.masaTamat) return 0; // masih berjalan
  const a = new Date(`${b.tarikh}T${b.masaMula}:00`);
  const z = new Date(`${tarikhTamatEf(b)}T${b.masaTamat}:00`);
  return Math.max(0, (z - a) / 3600000);
};
const jam = (m1, m2) => {
  if(!m1 || !m2) return 0; // tempahan masih berjalan (belum ada masa tamat)
  const [h1,n1] = m1.split(":").map(Number), [h2,n2] = m2.split(":").map(Number);
  return Math.max(0, (h2*60+n2 - h1*60-n1) / 60);
};
const fmtBulan = (ym) => {
  const bln = ["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
  const [y,m] = ym.split("-");
  return `${bln[parseInt(m)-1]} ${y}`;
};

function notify(msg){
  const t = $("toast");
  t.innerHTML = `<span style="color:#34d399">✔</span> ${esc(msg)}`;
  t.classList.add("show");
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove("show"), 3000);
}

/* Semakan konflik: tempahan diluluskan yang bertindih tarikh & masa pada kenderaan/pemandu sama */
function conflicts(booking, vehicleId, driverId){
  // Konflik = julat (tarikh mula + masa mula) hingga (tarikh tamat + masa tamat) bertindih.
  // Tempahan berbilang hari menyekat KESEMUA hari dalam julatnya.
  return bookings.filter(b =>
    b.id !== booking.id &&
    b.status === "diluluskan" &&
    mulaDT(b) < tamatDT(booking) && mulaDT(booking) < tamatDT(b) &&
    (b.vehicleId === vehicleId || b.driverId === driverId)
  );
}

/* ============================================================
   SAMBUNGAN API (Apps Script) + LOG MASUK
   ============================================================ */
const apiAktif = () => API_URL.startsWith("http");
let TOKEN = null;
let currentUser = null;
let users = [];
const isAdmin = () => currentUser && currentUser.peranan === "admin";

async function api(action, payload = {}){
  const r = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // elak isu CORS preflight
    body: JSON.stringify({ action, token: TOKEN, ...payload }),
  });
  return await r.json();
}

function setSync(mode){
  const el = $("sync");
  const cfg = {
    local:  ["local", "⬤ Mod Tempatan"],
    loading:["saving","⬤ Memuatkan…"],
    saving: ["saving","⬤ Menyimpan…"],
    ok:     ["ok",    "⬤ Online"],
    err:    ["err",   "⬤ Gagal sambung — data tidak disimpan"],
  }[mode];
  el.className = "sync " + cfg[0];
  el.textContent = cfg[1];
}

function dataKosong(d){
  return ["vehicles","drivers","bookings","maintenance"].every(k => !d[k] || d[k].length === 0);
}

function pakaiData(d){
  vehicles = d.vehicles || [];
  drivers = d.drivers || [];
  bookings = d.bookings || [];
  maintenance = d.maintenance || [];
  if(d.users) users = d.users;
  if(d.counters){
    nextNum = d.counters.nextNum || nextNum;
    nextVeh = d.counters.nextVeh || nextVeh;
    nextDrv = d.counters.nextDrv || nextDrv;
    nextSel = d.counters.nextSel || nextSel;
  }
}

/* Simpan automatik (debounce 600ms supaya tidak membanjiri API) */
let _saveTm = null;
function sync(){
  render();
  if(!apiAktif() || !TOKEN){ setSync("local"); return; }
  setSync("saving");
  clearTimeout(_saveTm);
  _saveTm = setTimeout(saveNow, 600);
}

async function saveNow(){
  if(!apiAktif() || !TOKEN) return;
  try{
    const res = await api("save", { data: {
      vehicles, drivers, bookings, maintenance,
      counters: { nextNum, nextVeh, nextDrv, nextSel },
    }});
    if(res.sesiTamat){ sesiTamat(); return; }
    setSync(res.ok ? "ok" : "err");
  }catch(e){ setSync("err"); }
}

async function doLogin(){
  const id = $("lg-id").value.trim(), pw = $("lg-pw").value;
  if(!id || !pw){ $("lg-err").innerHTML = '<span class="err">Sila isi ID pengguna dan kata laluan.</span>'; return; }
  const btn = $("lg-ok"); btn.disabled = true; btn.textContent = "Menyemak…";
  try{
    const res = await api("login", { userId: id, password: pw });
    if(!res.ok){
      $("lg-err").innerHTML = `<span class="err">${esc(res.ralat || "Log masuk gagal.")}</span>`;
      btn.disabled = false; btn.textContent = "Log Masuk"; return;
    }
    TOKEN = res.token;
    currentUser = res.user;
    if(res.data){
      if(dataKosong(res.data) && currentUser.peranan === "admin"){
        if(res.data.users) users = res.data.users;
        saveNow(); // sheet masih kosong & admin — hantar data contoh sebagai permulaan
      } else pakaiData(res.data);
    }
    masukApp();
    setSync("ok");
  }catch(e){
    $("lg-err").innerHTML = '<span class="err">Tidak dapat menghubungi pelayan. Semak API_URL dan sambungan internet.</span>';
    btn.disabled = false; btn.textContent = "Log Masuk";
  }
}

function renderAwam(){
  const akan = bookings
    .filter(b => b.status === "diluluskan" && tarikhTamatEf(b) >= HARI_INI)
    .sort((a,b) => (a.tarikh + a.masaMula).localeCompare(b.tarikh + b.masaMula));

  const rows = akan.length === 0
    ? `<div style="padding:30px;text-align:center;color:var(--slate-l);font-size:14px">Tiada tempahan sedang berjalan buat masa ini.</div>`
    : akan.map(t => {
        const v = veh(t.vehicleId), d = drv(t.driverId);
        return `<div style="padding:14px 20px;border-bottom:1px solid #f8fafc;display:flex;align-items:center;gap:18px;flex-wrap:wrap">
          <div style="min-width:120px">
            <div style="font-weight:700;font-size:13px">${paparTarikh(t)}</div>
            <div style="font-family:Consolas,monospace;font-size:13px;color:var(--slate)">${paparMasa(t)}</div>
          </div>
          <div style="flex:1;min-width:200px">
            <div style="font-weight:600">${esc(t.tujuan)}</div>
            <div class="muted">${esc(t.destinasi)}${t.bahagian ? " · " + esc(t.bahagian) : ""}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            ${v ? `<span class="plat">${esc(v.plat)}</span>` : ""}
            <span style="font-size:13px;color:var(--slate)">${d ? esc(d.nama) : ""}</span>
            ${chip(BSTATUS[t.status])}
          </div>
        </div>`;
      }).join("");

  const head = MINGGU.map((t,i) =>
    `<th style="${t===HARI_INI?'color:var(--amber-d)':''}">${HARI[i]}<br><span style="font-weight:400;text-transform:none">${fmtTarikh(t)}</span></th>`).join("");
  const gRows = drivers.map(d => {
    const cells = MINGGU.map(tarikh => {
      const cls = tarikh === HARI_INI ? "today" : "";
      if(d.status === "cuti") return `<td class="${cls}"><span class="off">Cuti</span></td>`;
      const tugas = bookings.filter(b => b.driverId === d.id && dudukiHari(b, tarikh) && (b.status==="diluluskan"||b.status==="selesai"));
      if(tugas.length === 0) return `<td class="${cls}"><span class="free">Kosong</span></td>`;
      return `<td class="${cls}">${tugas.map(t => {
        const v = veh(t.vehicleId);
        return `<div class="duty"><div class="tm">${paparMasa(t)}</div><div>${esc(t.destinasi)}</div><div class="pl">${v?esc(v.plat):""}</div></div>`;
      }).join("")}</td>`;
    }).join("");
    return `<tr><td style="min-width:180px"><div class="drv-nm">${esc(d.nama)}</div>
      <span class="toggle ${d.status==='bertugas'?'on':'off2'}" style="margin-top:6px;display:inline-block">${d.status==='bertugas'?'● Bertugas':'○ Cuti'}</span></td>${cells}</tr>`;
  }).join("");

  return `
    <div class="card">
      <div class="card-h"><h3>🛣️ Tempahan Sedang Berjalan & Akan Datang</h3><span class="muted">Hari ini: ${fmtTarikh(HARI_INI)}</span></div>
      ${rows}
    </div>
    <div class="card">
      <div class="card-h"><h3>👥 Jadual Pemandu Minggu Ini</h3></div>

    </div>`;
}

  const statusPanel = saya ? `
    <div class="card"><div style="padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div>

      </div>
      <div style="display:flex;align-items:center;gap:10px">
        ${chip(saya.status === "bertugas" ? {label:"● Bertugas", cls:"green"} : {label:"○ Cuti", cls:"gray"})}
        <button class="btn ${saya.status === "bertugas" ? "btn-dark" : "btn-amber"}" onclick="tukarStatusSaya()">
          ${saya.status === "bertugas" ? "Tukar ke Cuti" : "Tukar ke Bertugas"}
        </button>
      </div>
    </div></div>` : "";

  return `
    <h2 class="sect">Tugasan Saya — ${esc(saya ? saya.nama : currentUser.nama)}</h2>
    ${statusPanel}
    ${aktif.length === 0
      ? `<div class="card" style="padding:32px;text-align:center;color:var(--slate-l)">Tiada tugasan aktif buat masa ini. 👍</div>`
      : `<div style="display:grid;gap:14px">${aktif.map(t => kad(t, true)).join("")}</div>`}
    ${sejarah.length ? `<h2 class="sect" style="margin-top:8px">Sejarah Selesai (10 terkini)</h2>
      <div style="display:grid;gap:14px">${sejarah.map(t => kad(t, false)).join("")}</div>` : ""}`;
}

async function tukarStatusSaya(){
  const d = drv(currentUser.driverId);
  if(!d) return;
  const baru = d.status === "bertugas" ? "cuti" : "bertugas";
  d.status = baru;
  render();
  if(apiAktif() && TOKEN){
    setSync("saving");
    try{
      const res = await api("drvStatus", { status: baru });
      if(res.sesiTamat){ sesiTamat(); return; }
      if(!res.ok){
        d.status = baru === "bertugas" ? "cuti" : "bertugas"; // kembalikan jika gagal
        render(); setSync("err"); notify(res.ralat || "Gagal mengemas kini status.");
        return;
      }
      setSync("ok");
    }catch(e){
      d.status = baru === "bertugas" ? "cuti" : "bertugas";
      render(); setSync("err"); notify("Gagal menghubungi pelayan.");
      return;
    }
  }
  notify(baru === "bertugas" ? "Status anda kini: Bertugas." : "Status anda kini: Cuti.");
}

function siapTugas(id){
  const t = bookings.find(b => b.id === id);
  confirmModal("Selesai Tugasan " + id,
    `Sahkan tugasan ke <b>${esc(t.destinasi)}</b> telah selesai?<br><br>
     Masa sebenar akan direkodkan oleh pelayan.<br>
     Kenderaan dan jadual anda akan dibebaskan untuk tempahan baharu selepas ini.`,
    async () => {
      closeModal();
      /* Mod demo / tiada API: kemas kini setempat sahaja */
      if(!apiAktif() || !TOKEN){
        t.status = "selesai"; t.masaSelesai = skrgStr();
        const [tkhS, msS] = t.masaSelesai.split(" ");
        if(!t.masaTamat) t.masaTamat = msS;
        if(tkhS !== t.tarikh) t.tarikhTamat = tkhS;
        render(); notify(`Tugasan ${id} selesai.`); return;
      }
      /* Server sahkan pemandu yang ditugaskan & rekod masa server */
      setSync("saving");
      try{
        const res = await api("bookingComplete", { id });
        if(res.sesiTamat){ sesiTamat(); return; }
        if(!res.ok){ setSync("err"); notify(res.ralat || "Gagal menyelesaikan tugasan."); return; }
        Object.assign(t, res.booking);
        setSync("ok"); render(); notify(`Tugasan ${id} selesai. Terima kasih!`);
      }catch(e){
        setSync("err"); notify("Gagal menghubungi pelayan.");
      }
    }, "✔ Ya, Sudah Selesai", "btn-green");
}

/* Status kenderaan dikira automatik: 'selenggara' ditetap admin; selainnya
   'dalam_perjalanan' jika ada tempahan diluluskan meliputi masa kini, jika tidak 'tersedia'. */
function statusKenderaan(v){
  if(v.status === "selenggara") return "selenggara";
  const k = klNow(); const skrg = `${k.tarikh} ${k.masa}`;
  const sibuk = bookings.some(b => b.vehicleId === v.id && b.status === "diluluskan"
    && mulaDT(b) <= skrg && skrg <= tamatDT(b));
  return sibuk ? "dalam_perjalanan" : "tersedia";
}

/* ================= TINDAKAN ================= */
function updVehicle(id, key, val){
  const v = veh(id); v[key] = val; sync();
}
function toggleDriver(id){
  const d = drv(id); d.status = d.status === "bertugas" ? "cuti" : "bertugas"; sync();
}
function complete(id){
  const b = bookings.find(b => b.id === id);
  b.status = "selesai";
  b.masaSelesai = skrgStr();
  const [tkhS, msS] = b.masaSelesai.split(" ");
  if(!b.masaTamat) b.masaTamat = msS;
  if(tkhS !== b.tarikh) b.tarikhTamat = tkhS;
  sync(); notify(`Tempahan ${id} ditanda selesai pada ${fmtMasaSelesai(b.masaSelesai)}.`);
}

/* ---------- Modal: proses kelulusan ---------- */
function openApprove(id){
  const b = bookings.find(x => x.id === id);
  const vehOpts = vehicles.filter(v => v.status !== "selenggara").map(v =>
    `<option value="${v.id}" ${v.kapasiti < b.penumpang ? "disabled" : ""}>${esc(v.plat)} · ${esc(v.model)} (${v.kapasiti} tempat)${v.kapasiti < b.penumpang ? " — kapasiti tidak mencukupi" : ""}</option>`
  ).join("");
  const drvOpts = drivers.map(d =>
    `<option value="${d.id}" ${d.status==="cuti" ? "disabled" : ""}>${esc(d.nama)}${d.status==="cuti" ? " — bercuti" : ""}</option>`
  ).join("");

  $("modal-root").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-h"><h3>Proses Tempahan ${b.id}</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
      <div class="modal-b">
        <div class="summary">
          <b>${esc(b.tujuan)}</b><br>
          ${esc(b.destinasi)} · ${paparTarikh(b)}, ${paparMasa(b)} · ${b.penumpang} penumpang<br>
          <span class="muted">${esc(b.pemohon)} — ${esc(b.bahagian)}</span>
        </div>
        <label class="fld"><span>Tugaskan Kenderaan</span>
          <select id="ap-veh" onchange="checkClash('${b.id}')"><option value="">— Pilih kenderaan —</option>${vehOpts}</select>
        </label>
        <label class="fld"><span>Tugaskan Pemandu</span>
          <select id="ap-drv" onchange="checkClash('${b.id}')"><option value="">— Pilih pemandu —</option>${drvOpts}</select>
        </label>
        <div id="ap-clash"></div>

          <button class="btn btn-red" onclick="doReject('${b.id}')">✕ Tolak</button>
        </div>
      </div>
    </div>
  </div>`;
}

function checkClash(id){
  const b = bookings.find(x => x.id === id);
  const vId = $("ap-veh").value, dId = $("ap-drv").value;
  const box = $("ap-clash"), ok = $("ap-ok");
  if(!vId || !dId){ box.innerHTML = ""; ok.disabled = true; return; }
  const cl = conflicts(b, vId, dId);
  if(cl.length){
    box.innerHTML = `<div class="clash"><b>⚠️ Konflik jadual dikesan:</b>${cl.map(c =>
      `<p>• ${c.id} — ${esc(c.destinasi)}, ${paparMasa(c)}</p>`).join("")}</div>`;
    ok.disabled = true;
  } else {
    box.innerHTML = "";
    ok.disabled = false;
  }
}

async function doApprove(id){
  const b = bookings.find(x => x.id === id);
  const vId = $("ap-veh").value, dId = $("ap-drv").value;

  /* Mod demo / tiada API */
  if(!apiAktif() || !TOKEN){
    b.status = "diluluskan"; b.vehicleId = vId; b.driverId = dId;
    closeModal(); render(); notify(`Tempahan ${id} diluluskan (mod tempatan).`);
    return;
  }
  /* Server sahkan konflik & kapasiti sebelum lulus */
  const btn = $("ap-ok"); btn.disabled = true; btn.textContent = "Memproses…";
  try{
    const res = await api("bookingApprove", { id, vehicleId: vId, driverId: dId });
    if(res.sesiTamat){ sesiTamat(); return; }
    if(!res.ok){
      $("ap-clash").innerHTML = `<div class="clash"><b>⚠️ ${esc(res.ralat || "Gagal meluluskan.")}</b></div>`;
      btn.disabled = false; btn.textContent = "✔ Luluskan"; return;
    }
    Object.assign(b, res.booking);
    closeModal(); render(); notify(`Tempahan ${id} diluluskan.`);
  }catch(e){
    $("ap-clash").innerHTML = `<div class="clash"><b>Gagal menghubungi pelayan.</b></div>`;
    btn.disabled = false; btn.textContent = "✔ Luluskan";
  }
}
async function doReject(id){
  const b = bookings.find(x => x.id === id);
  if(!apiAktif() || !TOKEN){
    b.status = "ditolak"; closeModal(); render(); notify(`Tempahan ${id} ditolak (mod tempatan).`);
    return;
  }
  try{
    const res = await api("bookingReject", { id });
    if(res.sesiTamat){ sesiTamat(); return; }
    if(!res.ok){ notify(res.ralat || "Gagal menolak tempahan."); return; }
    Object.assign(b, res.booking);
    closeModal(); render(); notify(`Tempahan ${id} ditolak.`);
  }catch(e){ notify("Gagal menghubungi pelayan."); }
}

        <div id="f-err"></div>
        <button class="btn btn-amber" id="f-ok" style="justify-content:center" onclick="submitForm()">Hantar Tempahan</button>
      </div>
    </div>
  </div>`;
  checkForm();
}

function checkForm(){
  const mula = $("f-mula").value, tamat = $("f-tamat").value;
  const tkh = $("f-tarikh").value, tkh2 = $("f-tkh2").value;
  const sehari = !tkh2 || tkh2 === tkh;                 // tempahan hari yang sama
  const tarikhOK = !tkh2 || tkh2 >= tkh;                // tarikh tamat tidak boleh sebelum tarikh mula
  const masaOK = !sehari || !tamat || mula < tamat;     // peraturan masa hanya untuk hari sama
  const valid = $("f-pemohon").value.trim() && $("f-bahagian").value.trim() &&
                $("f-tujuan").value.trim() && $("f-destinasi").value.trim() &&
                tkh && mula && tarikhOK && masaOK;
  let mesej = `<span class="muted">Masa tamat boleh dibiarkan kosong — ia direkodkan automatik apabila pemandu menanda Selesai. Untuk tempahan bermalam / lebih sehari, isi Tarikh Tamat.</span>`;
  if(!tarikhOK) mesej = `<span class="err">Tarikh tamat mesti pada atau selepas tarikh mula.</span>`;
  else if(sehari && tamat && mula >= tamat) mesej = `<span class="err">Masa tamat mesti selepas masa mula.</span>`;
  $("f-err").innerHTML = mesej;
  $("f-ok").disabled = !valid;
}

async function submitForm(){
  const booking = {
    pemohon: $("f-pemohon").value.trim(),
    bahagian: $("f-bahagian").value.trim(),
    tujuan: $("f-tujuan").value.trim(),
    destinasi: $("f-destinasi").value.trim(),
    tarikh: $("f-tarikh").value,
    tarikhTamat: $("f-tkh2").value || "",
    masaMula: $("f-mula").value,
    masaTamat: $("f-tamat").value,
    penumpang: parseInt($("f-pax").value) || 1,
  };

  /* Mod demo / tiada API: simpan setempat sahaja (tidak kekal) */
  if(!apiAktif() || !TOKEN){
    const id = `T-${nextNum++}`;
    bookings.unshift({ id, status:"menunggu", vehicleId:null, driverId:null,
      userId: currentUser ? currentUser.userId : null, masaSelesai:"", ...booking });
    closeModal(); render(); notify(`Tempahan ${id} dihantar (mod tempatan).`);
    return;
  }

  /* Server jana ID & tetapkan status — pemohon tidak boleh lulus sendiri */
  const btn = $("f-ok"); btn.disabled = true; btn.textContent = "Menghantar…";
  try{
    const res = await api("bookingAdd", { booking });
    if(res.sesiTamat){ sesiTamat(); return; }
    if(!res.ok){
      $("f-err").innerHTML = `<span class="err">${esc(res.ralat || "Gagal menghantar tempahan.")}</span>`;
      btn.disabled = false; btn.textContent = "Hantar Tempahan"; return;
    }
    bookings.unshift(res.booking);
    closeModal(); render(); notify(`Tempahan ${res.booking.id} dihantar untuk kelulusan.`);
  }catch(e){
    $("f-err").innerHTML = '<span class="err">Gagal menghubungi pelayan.</span>';
    btn.disabled = false; btn.textContent = "Hantar Tempahan";
  }
}

function checkSelForm(){

}

function submitSel(id){
  const data = {
    vehicleId: $("s-veh").value,
    tarikh: $("s-tarikh").value,
    jenis: $("s-jenis").value,
    butiran: $("s-butiran").value.trim(),
    bengkel: $("s-bengkel").value.trim(),
    kos: parseFloat($("s-kos").value) || 0,
    odometer: parseInt($("s-odo").value) || 0,
    status: $("s-status").value,
  };
  if(id){
    Object.assign(maintenance.find(x => x.id === id), data);
    notify("Rekod selenggaraan dikemas kini.");
  } else {
    maintenance.push({ id:`S${nextSel++}`, ...data });
    notify("Rekod selenggaraan ditambah.");
  }
  closeModal(); sync();
}

function askDelSel(id){
  const s = maintenance.find(x => x.id === id);
  const v = veh(s.vehicleId);
  confirmModal("Padam Rekod Selenggaraan",
    `Anda pasti mahu memadam rekod <b>${esc(s.jenis)}</b> (${fmtTarikh(s.tarikh)})${v ? ` bagi <b>${esc(v.plat)}</b>` : ""}? Tindakan ini tidak boleh dibatalkan.`,
    () => {
      maintenance = maintenance.filter(x => x.id !== id);
      closeModal(); sync(); notify("Rekod selenggaraan dipadam.");
    });
}

function renderLaporan(){
  const bln = bookings.filter(b => b.tarikh.startsWith(rptBulan));
  const aktif = bln.filter(b => b.status === "diluluskan" || b.status === "selesai");
  const sel = maintenance.filter(s => s.tarikh.startsWith(rptBulan) && s.status !== "dijadual");
  const kosSel = sel.reduce((t,s) => t + s.kos, 0);
  const jmlJam = aktif.reduce((t,b) => t + jamTempahan(b), 0);

  /* Penggunaan kenderaan */
  const vUse = vehicles.map(v => {
    const trips = aktif.filter(b => b.vehicleId === v.id);
    return { v, trips: trips.length, jam: trips.reduce((t,b) => t + jamTempahan(b), 0) };
  }).sort((a,b) => b.trips - a.trips);

  /* Tugasan pemandu */
  const dUse = drivers.map(d => {
    const trips = aktif.filter(b => b.driverId === d.id);
    return { d, trips: trips.length, jam: trips.reduce((t,b) => t + jamTempahan(b), 0) };
  }).sort((a,b) => b.trips - a.trips);

  /* Tempahan mengikut bahagian */
  const bhg = {};
  bln.forEach(b => { bhg[b.bahagian] = (bhg[b.bahagian] || 0) + 1; });
  const bhgRows = Object.entries(bhg).sort((a,b) => b[1] - a[1]).map(([nama,n]) =>
    `<tr><td>${esc(nama)}</td><td style="text-align:right;font-weight:700">${n}</td></tr>`).join("")
    || `<tr><td colspan="2" style="text-align:center;color:var(--slate-l);padding:20px">Tiada data.</td></tr>`;

  const selRows = sel.length === 0
    ? `<tr><td colspan="4" style="text-align:center;color:var(--slate-l);padding:20px">Tiada kerja selenggaraan bulan ini.</td></tr>`
    : sel.map(s => {
        const v = veh(s.vehicleId);
        return `<tr><td style="white-space:nowrap">${fmtTarikh(s.tarikh)}</td><td>${v?esc(v.plat):"—"}</td><td>${esc(s.jenis)} — <span class="muted">${esc(s.butiran)}</span></td><td class="kos">${rm(s.kos)}</td></tr>`;
      }).join("");

  return `
    <div class="print-title">
      <h2>Laporan Bulanan Penggunaan Kenderaan</h2>
      <p>PERBADANAN PERPUSTAKAAN AWAM TERENGGANU · Bahagian Khidmat Pengurusan · ${fmtBulan(rptBulan)}</p>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px" class="no-print">
      <h2 class="sect">Laporan Bulanan — ${fmtBulan(rptBulan)}</h2>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <input type="month" style="width:auto" value="${rptBulan}" onchange="rptBulan=this.value;render()">
        <button class="btn btn-dark" onclick="window.print()">🖨 Cetak Laporan</button>
      </div>
    </div>
    <div class="rpt-grid">
      <div class="rpt-stat"><div class="v">${bln.length}</div><div class="l">Jumlah Tempahan</div></div>
      <div class="rpt-stat"><div class="v c-green">${bln.filter(b=>b.status==="selesai").length}</div><div class="l">Selesai</div></div>
      <div class="rpt-stat"><div class="v c-amber">${bln.filter(b=>b.status==="diluluskan").length}</div><div class="l">Diluluskan (Aktif)</div></div>
      <div class="rpt-stat"><div class="v c-red">${bln.filter(b=>b.status==="ditolak").length}</div><div class="l">Ditolak</div></div>
      <div class="rpt-stat"><div class="v c-sky">${jmlJam.toFixed(1)}</div><div class="l">Jam Penggunaan</div></div>
      <div class="rpt-stat"><div class="v">${rm(kosSel)}</div><div class="l">Kos Selenggaraan</div></div>
    </div>
    <div class="card">
      <div class="card-h"><h3>🚗 Penggunaan Kenderaan</h3></div>
      <div class="tbl-scroll"><table>
        <thead><tr><th>Kenderaan</th><th style="text-align:right">Bil. Pergerakan</th><th style="text-align:right">Jumlah Jam</th></tr></thead>
        <tbody>${vUse.map(u => `<tr>
          <td><span class="plat">${esc(u.v.plat)}</span> &nbsp;${esc(u.v.model)}</td>
          <td style="text-align:right;font-weight:700">${u.trips}</td>
          <td style="text-align:right">${u.jam.toFixed(1)} jam</td>
        </tr>`).join("")}</tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="card-h"><h3>👥 Tugasan Pemandu</h3></div>
      <div class="tbl-scroll"><table>
        <thead><tr><th>Pemandu</th><th style="text-align:right">Bil. Tugasan</th><th style="text-align:right">Jumlah Jam</th></tr></thead>
        <tbody>${dUse.map(u => `<tr>
          <td>${esc(u.d.nama)}</td>
          <td style="text-align:right;font-weight:700">${u.trips}</td>
          <td style="text-align:right">${u.jam.toFixed(1)} jam</td>
        </tr>`).join("")}</tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="card-h"><h3>🏢 Tempahan Mengikut Bahagian</h3></div>
      <div class="tbl-scroll"><table>
        <thead><tr><th>Bahagian / Unit</th><th style="text-align:right">Bil. Tempahan</th></tr></thead>
        <tbody>${bhgRows}</tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="card-h"><h3>🔧 Kos Selenggaraan Bulan Ini</h3></div>
      <div class="tbl-scroll"><table>
        <thead><tr><th>Tarikh</th><th>Kenderaan</th><th>Kerja</th><th style="text-align:right">Kos</th></tr></thead>
        <tbody>${selRows}</tbody>
        ${sel.length ? `<tfoot><tr><td colspan="3">JUMLAH</td><td class="kos">${rm(kosSel)}</td></tr></tfoot>` : ""}
      </table></div>
    </div>`;
}

function checkUserForm(){
  const pw = $("u-pw").value, pw2 = $("u-pw2").value;

  if(pw && pw.length < 6) err = "Kata laluan mestilah sekurang-kurangnya 6 aksara.";
  else if(pw && pw2 && pw !== pw2) err = "Kata laluan tidak sepadan.";
  $("u-err").innerHTML = err ? `<span class="err">${err}</span>` : "";
  $("u-ok").disabled = !($("u-id").value.trim() && $("u-nm").value.trim() && pw.length >= 6 && pw === pw2);

async function submitUser(){
  const btn = $("u-ok"); btn.disabled = true; btn.textContent = "Menyimpan…";
  try{
    const res = await api("userAdd", {
      userId: $("u-id").value.trim(),
      nama: $("u-nm").value.trim(),
      peranan: $("u-role").value,
      driverId: $("u-role").value === "pemandu" ? $("u-drv").value : null,
      password: $("u-pw").value,
    });
    if(res.sesiTamat){ sesiTamat(); return; }
    if(!res.ok){
      $("u-err").innerHTML = `<span class="err">${esc(res.ralat)}</span>`;
      btn.disabled = false; btn.textContent = "Tambah Pengguna"; return;
    }
    users = res.users;
    closeModal(); render(); notify("Pengguna ditambah.");
  }catch(e){
    $("u-err").innerHTML = '<span class="err">Gagal menghubungi pelayan.</span>';
    btn.disabled = false; btn.textContent = "Tambah Pengguna";
  }
}

      <div class="modal-h"><h3>Tukar Kata Laluan — ${esc(u.nama)}</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
      <div class="modal-b">
        <label class="fld"><span>Kata Laluan Baharu</span><input id="r-pw" type="password" oninput="checkResetPw()"></label>
        <label class="fld"><span>Ulang Kata Laluan</span><input id="r-pw2" type="password" oninput="checkResetPw()"></label>
        <div id="r-err"></div>
        <button class="btn btn-amber" id="r-ok" style="justify-content:center" onclick="submitResetPw('${esc(userId)}')">Simpan Kata Laluan</button>
      </div>
    </div>
  </div>`;
  checkResetPw();
}

function checkResetPw(){
  const pw = $("r-pw").value, pw2 = $("r-pw2").value;
  let err = "";
  if(pw && pw.length < 6) err = "Kata laluan mestilah sekurang-kurangnya 6 aksara.";
  else if(pw && pw2 && pw !== pw2) err = "Kata laluan tidak sepadan.";
  $("r-err").innerHTML = err ? `<span class="err">${err}</span>` : "";
  $("r-ok").disabled = !(pw.length >= 6 && pw === pw2);
}

async function submitResetPw(userId){
  const btn = $("r-ok"); btn.disabled = true; btn.textContent = "Menyimpan…";
  try{
    const res = await api("userReset", { userId, password: $("r-pw").value });
    if(res.sesiTamat){ sesiTamat(); return; }
    if(!res.ok){
      $("r-err").innerHTML = `<span class="err">${esc(res.ralat)}</span>`;
      btn.disabled = false; btn.textContent = "Simpan Kata Laluan"; return;
    }
    users = res.users;
    closeModal(); render(); notify("Kata laluan dikemas kini.");
  }catch(e){
    $("r-err").innerHTML = '<span class="err">Gagal menghubungi pelayan.</span>';
    btn.disabled = false; btn.textContent = "Simpan Kata Laluan";
  }
}

function askDelUser(userId){
  const u = users.find(x => x.userId === userId);
  confirmModal("Padam Pengguna",
    `Anda pasti mahu memadam akaun <b>${esc(u.nama)}</b> (${esc(u.userId)})? Pengguna ini tidak akan dapat log masuk lagi.`,
    async () => {
      try{
        const res = await api("userDel", { userId });
        if(res.sesiTamat){ sesiTamat(); return; }
        if(!res.ok){ closeModal(); notify(res.ralat); return; }
        users = res.users;
        closeModal(); render(); notify("Pengguna dipadam.");
      }catch(e){ closeModal(); notify("Gagal menghubungi pelayan."); }
    });
}

/* ============================================================
   TUKAR KATA LALUAN SENDIRI (semua peranan)
   ============================================================ */
function openTukarPwSendiri(){
  if(!currentUser) return;
  if(!apiAktif() || !TOKEN){ notify("Mod demo: tiada kata laluan untuk ditukar."); return; }
  $("modal-root").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:420px">
      <div class="modal-h"><h3>Tukar Kata Laluan Saya</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
      <div class="modal-b">
        <p class="muted" style="font-size:13px">Akaun: <b>${esc(currentUser.userId)}</b> — ${esc(currentUser.nama)}</p>
        <label class="fld"><span>Kata Laluan Semasa</span><input id="my-pw0" type="password" oninput="checkMyPw()"></label>
        <label class="fld"><span>Kata Laluan Baharu</span><input id="my-pw1" type="password" oninput="checkMyPw()"></label>
        <label class="fld"><span>Ulang Kata Laluan Baharu</span><input id="my-pw2" type="password" oninput="checkMyPw()"></label>
        <div id="my-err"></div>
        <button class="btn btn-amber" id="my-ok" style="justify-content:center" onclick="submitMyPw()">Simpan Kata Laluan</button>
      </div>
    </div>
  </div>`;
  checkMyPw();
}

function checkMyPw(){
  const p0 = $("my-pw0").value, p1 = $("my-pw1").value, p2 = $("my-pw2").value;
  let err = "";
  if(p1 && p1.length < 6) err = "Kata laluan baharu mestilah sekurang-kurangnya 6 aksara.";
  else if(p1 && p2 && p1 !== p2) err = "Kata laluan baharu tidak sepadan.";
  else if(p0 && p1 && p0 === p1) err = "Kata laluan baharu mestilah berbeza daripada yang semasa.";
  $("my-err").innerHTML = err ? `<span class="err">${err}</span>` : "";
  $("my-ok").disabled = !(p0 && p1.length >= 6 && p1 === p2 && p0 !== p1);
}

async function submitMyPw(){
  const btn = $("my-ok"); btn.disabled = true; btn.textContent = "Menyimpan…";
  try{
    const res = await api("tukarPw", {
      passwordLama: $("my-pw0").value,
      passwordBaru: $("my-pw1").value,
    });
    if(res.sesiTamat){ sesiTamat(); return; }
    if(!res.ok){
      $("my-err").innerHTML = `<span class="err">${esc(res.ralat || "Gagal menukar kata laluan.")}</span>`;
      btn.disabled = false; btn.textContent = "Simpan Kata Laluan"; return;
    }
    closeModal(); notify("Kata laluan berjaya ditukar. Gunakan kata laluan baharu pada log masuk akan datang.");
  }catch(e){
    $("my-err").innerHTML = '<span class="err">Gagal menghubungi pelayan.</span>';
    btn.disabled = false; btn.textContent = "Simpan Kata Laluan";
  }
}

function closeModal(){ $("modal-root").innerHTML = ""; }

/* ============================================================
   TAMBAH / EDIT / PADAM KENDERAAN
   ============================================================ */
function openVehForm(id){
  editVehId = id || null;
  const v = id ? veh(id) : null;
  $("modal-root").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-h"><h3>${v ? "Edit Kenderaan — " + esc(v.plat) : "Tambah Kenderaan Baharu"}</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
      <div class="modal-b">
        <div class="row2">
          <label class="fld"><span>No. Pendaftaran (Plat)</span><input id="v-plat" value="${v?esc(v.plat):""}" placeholder="cth: WXY 1234" oninput="checkVehForm()"></label>
          <label class="fld"><span>Model</span><input id="v-model" value="${v?esc(v.model):""}" placeholder="cth: Toyota Hiace" oninput="checkVehForm()"></label>
        </div>
        <div class="row2">
          <label class="fld"><span>Jenis</span>
            <select id="v-jenis">
              <option ${v&&v.jenis==="Kereta Pejabat"?"selected":""}>Kereta Pejabat</option>
              <option ${v&&v.jenis==="Kenderaan Rasmi"?"selected":""}>Kenderaan Rasmi</option>
              <option ${v&&v.jenis==="Van Jabatan"?"selected":""}>Van Jabatan</option>
              <option ${v&&v.jenis==="Pacuan 4 Roda"?"selected":""}>Pacuan 4 Roda</option>
              <option ${v&&v.jenis==="Bas Jabatan"?"selected":""}>Bas Jabatan</option>
              <option ${v&&v.jenis==="Lori / Pickup"?"selected":""}>Lori / Pickup</option>
            </select>
          </label>
          <label class="fld"><span>Kapasiti (tempat duduk)</span><input type="number" id="v-kapasiti" value="${v?v.kapasiti:5}" min="1" max="44" oninput="checkVehForm()"></label>
        </div>
        <div class="row2">
          <label class="fld"><span>Odometer (km)</span><input type="number" id="v-odo" value="${v?v.odometer:0}" min="0"></label>
          <label class="fld"><span>Bahan Api (%)</span><input type="number" id="v-fuel" value="${v?v.bahanApi:100}" min="0" max="100"></label>
        </div>
        <div class="row2">
          <label class="fld"><span>Tamat Cukai Jalan</span><input type="date" id="v-tax" value="${v?v.roadtax:""}" oninput="checkVehForm()"></label>
          <label class="fld"><span>Status</span>
            <select id="v-status">
              <option value="tersedia" ${!v||v.status!=="selenggara"?"selected":""}>Dalam Khidmat</option>
              <option value="selenggara" ${v&&v.status==="selenggara"?"selected":""}>Selenggaraan</option>
            </select>
          </label>
        </div>
        <label class="fld"><span>Lokasi Semasa</span><input id="v-lokasi" value="${v?esc(v.lokasi):"Garaj Utama, Aras B1"}"></label>
        <div id="v-err"></div>
        <button class="btn btn-amber" id="v-ok" style="justify-content:center" onclick="submitVeh(${v?`'${v.id}'`:"null"})">
          ${v ? "Simpan Perubahan" : "Tambah Kenderaan"}
        </button>
      </div>
    </div>
  </div>`;
  checkVehForm();
}

function checkVehForm(){
  const plat = $("v-plat").value.trim();
  const dup = vehicles.some(v => v.plat.toLowerCase() === plat.toLowerCase() && v.id !== editVehId);
  const valid = plat && $("v-model").value.trim() && $("v-tax").value && parseInt($("v-kapasiti").value) > 0 && !dup;
  $("v-err").innerHTML = dup ? `<span class="err">No. pendaftaran ini sudah wujud dalam sistem.</span>` : "";
  $("v-ok").disabled = !valid;
}

function submitVeh(id){
  const data = {
    plat: $("v-plat").value.trim().toUpperCase(),
    model: $("v-model").value.trim(),
    jenis: $("v-jenis").value,
    kapasiti: parseInt($("v-kapasiti").value) || 1,
    odometer: parseInt($("v-odo").value) || 0,
    bahanApi: Math.min(100, Math.max(0, parseInt($("v-fuel").value) || 0)),
    roadtax: $("v-tax").value,
    status: $("v-status").value,
    lokasi: $("v-lokasi").value.trim() || "Garaj Utama",
  };
  if(id){
    Object.assign(veh(id), data);
    notify(`Kenderaan ${data.plat} dikemas kini.`);
  } else {
    vehicles.push({ id: `K${nextVeh++}`, ...data });
    notify(`Kenderaan ${data.plat} ditambah ke senarai kenderaan.`);
  }
  closeModal(); sync();
}

function askDelVehicle(id){
  const v = veh(id);
  const aktif = bookings.filter(b => b.vehicleId === id && b.status === "diluluskan");
  if(aktif.length){
    confirmModal("Tidak Boleh Dipadam",
      `Kenderaan <b>${esc(v.plat)}</b> mempunyai ${aktif.length} tempahan aktif yang diluluskan (${aktif.map(a=>a.id).join(", ")}). Sila selesaikan atau tugaskan semula tempahan tersebut dahulu.`,
      null);
    return;
  }
  confirmModal("Padam Kenderaan",
    `Anda pasti mahu memadam <b>${esc(v.plat)} — ${esc(v.model)}</b> daripada rekod kenderaan? Tindakan ini tidak boleh dibatalkan.`,
    () => {
      vehicles = vehicles.filter(x => x.id !== id);
      closeModal(); sync(); notify(`Kenderaan ${v.plat} dipadam.`);
    });
}

/* ============================================================
   TAMBAH / EDIT / PADAM PEMANDU
   ============================================================ */
function openDrvForm(id){
  const d = id ? drv(id) : null;
  $("modal-root").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-h"><h3>${d ? "Edit Pemandu" : "Tambah Pemandu Baharu"}</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
      <div class="modal-b">
        <label class="fld"><span>Nama Penuh</span><input id="d-nama" value="${d?esc(d.nama):""}" placeholder="cth: En. Ahmad bin Ali" oninput="checkDrvForm()"></label>
        <div class="row2">
          <label class="fld"><span>No. Telefon</span><input id="d-tel" value="${d?esc(d.telefon):""}" placeholder="cth: 012-345 6789" oninput="checkDrvForm()"></label>
          <label class="fld"><span>Kelas Lesen</span><input id="d-lesen" value="${d?esc(d.lesen):""}" placeholder="cth: D, E, GDL" oninput="checkDrvForm()"></label>
        </div>
        <label class="fld"><span>Status</span>
          <select id="d-status">
            <option value="bertugas" ${!d||d.status==="bertugas"?"selected":""}>Bertugas</option>
            <option value="cuti" ${d&&d.status==="cuti"?"selected":""}>Cuti</option>
          </select>
        </label>
        <button class="btn btn-amber" id="d-ok" style="justify-content:center" onclick="submitDrv(${d?`'${d.id}'`:"null"})">
          ${d ? "Simpan Perubahan" : "Tambah Pemandu"}
        </button>
      </div>
    </div>
  </div>`;
  checkDrvForm();
}

function checkDrvForm(){
  $("d-ok").disabled = !($("d-nama").value.trim() && $("d-tel").value.trim() && $("d-lesen").value.trim());
}

function submitDrv(id){
  const data = {
    nama: $("d-nama").value.trim(),
    telefon: $("d-tel").value.trim(),
    lesen: $("d-lesen").value.trim(),
    status: $("d-status").value,
  };
  if(id){
    Object.assign(drv(id), data);
    notify(`Maklumat pemandu dikemas kini.`);
  } else {
    drivers.push({ id: `P${nextDrv++}`, ...data });
    notify(`Pemandu ${data.nama} ditambah.`);
  }
  closeModal(); sync();
}

function askDelDriver(id){
  const d = drv(id);
  const aktif = bookings.filter(b => b.driverId === id && b.status === "diluluskan");
  if(aktif.length){
    confirmModal("Tidak Boleh Dipadam",
      `Pemandu <b>${esc(d.nama)}</b> mempunyai ${aktif.length} tugasan aktif (${aktif.map(a=>a.id).join(", ")}). Sila selesaikan atau tugaskan semula tempahan tersebut dahulu.`,
      null);
    return;
  }
  confirmModal("Padam Pemandu",
    `Anda pasti mahu memadam <b>${esc(d.nama)}</b> daripada senarai pemandu? Tindakan ini tidak boleh dibatalkan.`,
    () => {
      drivers = drivers.filter(x => x.id !== id);
      closeModal(); sync(); notify(`Pemandu ${d.nama} dipadam.`);
    });
}

/* ---------- Modal pengesahan generik ---------- */
let _confirmCb = null;
function confirmModal(title, htmlMsg, onYes, yesLabel, yesClass){
  _confirmCb = onYes;
  $("modal-root").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:440px">
      <div class="modal-h"><h3>${esc(title)}</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
      <div class="modal-b">
        <div class="confirm-txt">${htmlMsg}</div>
        <div class="btn-row">
          ${onYes
            ? `<button class="btn ${yesClass || "btn-red"}" onclick="_confirmCb()">${yesLabel || "🗑 Ya, Padam"}</button>
               <button class="btn btn-dark" style="flex:1;justify-content:center" onclick="closeModal()">Batal</button>`
            : `<button class="btn btn-dark" style="flex:1;justify-content:center" onclick="closeModal()">Faham</button>`}
        </div>
      </div>
    </div>
  </div>`;
}

mulaApp();

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
